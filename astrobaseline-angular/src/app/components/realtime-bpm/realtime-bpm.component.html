<div class="telemetry-card">
  <!-- Header con indicador EN VIVO -->
  <div class="telemetry-header">
    <div class="live-pill">
      <span
        class="live-pulse"
        [class.paused]="!isRunning()"
        [style.background-color]="activeColor()"
        [style.box-shadow]="'0 0 8px ' + activeColor()"
      ></span>
      <span class="live-text">{{ isRunning() ? i18n.t().live_telemetry : i18n.t().paused }}</span>
    </div>

    <div class="telemetry-controls">
      <span
        class="case-badge"
        [style.background-color]="activeColor() + '22'"
        [style.color]="activeColor()"
        [style.border-color]="activeColor() + '55'"
        title="Caso neuroconductual simulado en el mapeo"
      >
        {{ neuro.activeCase().shortName }}
      </span>

      <button
        class="pause-btn"
        (click)="toggleStreaming()"
        [title]="isRunning() ? i18n.t().pause_stream : i18n.t().resume_stream"
      >
        {{ isRunning() ? '⏸' : '▶' }}
      </button>
    </div>
  </div>

  <!-- Valor principal de LPM con latido interactivo -->
  <div class="bpm-main-display">
    <div class="heart-icon-wrapper">
      <span
        class="heart-beat"
        [class.paused]="!isRunning()"
        [style.animation-duration]="heartAnimationDuration()"
      >
        <svg class="heart-svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </span>
    </div>

    <div class="bpm-numbers">
      <span class="bpm-value" [style.color]="activeColor()">{{ currentBpm() }}</span>
      <span class="bpm-unit">LPM</span>
    </div>

    <div class="bpm-status-tag" [style.color]="statusLabel().color">
      {{ statusLabel().text }}
    </div>
  </div>

  <!-- Gráfica de Onda ECG en Tiempo Real -->
  <div class="canvas-container">
    <canvas #ecgCanvas width="270" height="95" class="ecg-canvas"></canvas>
    <div class="canvas-overlay-grid"></div>
  </div>

  <!-- Estadísticas de la sesión -->
  <div class="telemetry-stats">
    <div class="stat-col">
      <span class="stat-label">{{ i18n.t().stat_min }}</span>
      <span class="stat-val">{{ minBpm() }}</span>
    </div>
    <div class="stat-col">
      <span class="stat-label">{{ i18n.t().stat_avg }}</span>
      <span class="stat-val">{{ avgBpm() }}</span>
    </div>
    <div class="stat-col">
      <span class="stat-label">{{ i18n.t().stat_max }}</span>
      <span class="stat-val">{{ maxBpm() }}</span>
    </div>
  </div>
</div>
